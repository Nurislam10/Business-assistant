services:
  - type: web
    name: business-assistant
    runtime: node
    plan: free
    branch: main
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
